[project]
name = "projeto-clima"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Pedro-LPA", email = "pedrolucapires8627@.com" }
]
requires-python = ">=3.14"
dependencies = [
    "apache-airflow>=3.3.2",
    "apache-airflow-providers-postgres>=7.1.0",
    "matplotlib>=3.11.2",
    "numpy>=2.5.3",
    "pandas>=3.0.6",
    "psycopg2>=2.9.13",
    "psycopg2-binary>=2.9.13",
    "python-dotenv>=1.2.3",
    "requests>=2.34.2",
    "sqlalchemy>=2.1.1",
    "streamlit>=1.64.0",
]

[project.scripts]
projeto-clima = "projeto_clima:main"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"
